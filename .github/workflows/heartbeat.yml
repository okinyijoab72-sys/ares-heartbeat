# Wakes Project ARES every 10 minutes so due reminders, follow-ups and alerts go out on time.
name: ARES heartbeat
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 6 1 * *'
  workflow_dispatch:
jobs:
  tick:
    if: github.event.schedule != '0 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the ARES scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -fsS -m 90 -H "Authorization: Bearer $CRON_SECRET" https://joab-ares.vercel.app/api/tick
  keepalive:
    # GitHub pauses schedules in repos with no commits for 60 days: one empty commit a month prevents that.
    if: github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "ares-heartbeat"
          git config user.email "ares-heartbeat@users.noreply.github.com"
          git commit --allow-empty -m "Keep the heartbeat schedule active"
          git push
